<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Travel With Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>
    <nav class="navbar">
        <div class="logo">Travel With Us</div>
        <ul class="nav-links"><li><a href="index.html">Home</a></li></ul>
    </nav>
    <div class="container" style="max-width: 450px;">
        <h2>User / Admin Login</h2>
        <form onsubmit="handleLogin(event)" style="display:flex; flex-direction:column; gap:20px; margin-top:20px;">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="margin-top:25px; text-align:center;">Don't have an account? <a href="signup.html" style="color:var(--secondary-teal); font-weight:bold;">Sign Up</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
